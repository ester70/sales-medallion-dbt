version: 2

models:
  - name: dim_customer
    description: Customer dimension - one row per active customer
    columns:
      - name: customerID
        tests:
          - not_null
          - unique
      - name: first_name
        description: Customer first name (from silver_sales_customers_clean)
      - name: last_name
        description: Customer last name (from silver_sales_customers_clean)
      - name: city
        description: Customer home city
      - name: state
        description: Customer home state/province
      - name: country
        description: Customer home country
      - name: continent
        description: Customer home continent
      - name: gender
        description: Customer gender

  - name: dim_franchise
    description: Franchise dimension - one row per active franchise
    columns:
      - name: franchiseID
        tests:
          - not_null
          - unique
      - name: franchise_name
        description: Franchise display name (from silver_sales_franchises_clean)
      - name: city
        description: Franchise city
      - name: district
        description: Franchise district/area - used for region breakdowns
      - name: country
        description: Franchise country
      - name: franchise_size
        description: Franchise size category

  - name: dim_product
    description: Product dimension - one row per active product
    columns:
      - name: product
        tests:
          - not_null
          - unique

  - name: dim_payment_method
    description: Payment method dimension
    columns:
      - name: paymentMethod
        tests:
          - not_null
          - unique

  - name: dim_date
    description: Date dimension with calendar attributes
    columns:
      - name: sale_date
        tests:
          - not_null
          - unique

  - name: fact_sales
    description: >
      Sales fact table - measures with natural-key foreign keys to dimensions,
      plus the soft-delete flag (is_active) inherited from silver.
    columns:
      - name: transactionID
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null
      - name: franchise_id
        tests:
          - not_null
      - name: product_name
        tests:
          - not_null
      - name: sale_date
        tests:
          - not_null
      - name: payment_method
        tests:
          - not_null
      - name: is_active
        tests:
          - not_null
      - name: total_price
        tests:
          - non_zero
