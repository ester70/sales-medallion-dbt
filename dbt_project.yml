name: sales_medallion_dbt
version: '1.0.0'
config-version: 2
profile: sales_medallion_dbt

model-paths: ["models"]
macro-paths: ["macros"]

# Schemas are prefixed dbt_ (this project fully replaced the former SDP pipeline,
# which has been removed -- dbt is the sole medallion pipeline now).
models:
  sales_medallion_dbt:
    bronze:
      +schema: dbt_bronze
      +materialized: incremental
      +incremental_strategy: merge
      +unique_key: transactionID
    silver:
      +schema: dbt_silver
      +materialized: incremental
      +incremental_strategy: merge
      +unique_key: transactionID
    gold:
      +schema: dbt_gold
      +materialized: table
